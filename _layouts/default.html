<!DOCTYPE html>
<html lang="en">
<head>
	{% include google_tag.html %}
	<title>{{ page.title | default: "Terence Robinson" }} · TR</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="description" content="{{ page.subtitle | default: 'QA engineer writing about testing, tools, and learning in public.' }}" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>

	{% include navigation.html %}

	<div class="wrap page-header">
		<h1>{{ page.title }}</h1>
		{% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
	</div>

	<div class="wrap">
		{{ content }}
	</div>

	{% include footer.html %}

	<script src="{{ '/assets/js/nav.js' | relative_url }}"></script>
</body>
</html>
